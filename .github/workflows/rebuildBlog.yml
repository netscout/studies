name: Rebuild blog

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ping blog-generator
        env:
          # Fine-grained PAT with Contents read/write on netscout/blog-generator.
          TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "BLOG_DISPATCH_TOKEN is not set; skipping the rebuild ping."
            exit 0
          fi
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/netscout/blog-generator/dispatches \
            -d '{"event_type":"studies-updated"}'
